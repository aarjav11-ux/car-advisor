<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--fg:#e5e7eb;--muted:#9ca3af;--line:#4b5563;--card:#1a2029;--acc:#60a5fa}}
:root[data-theme="dark"]{--bg:#11151c;--fg:#e5e7eb;--muted:#9ca3af;--line:#4b5563;--card:#1a2029;--acc:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Raleway,system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
h1{font-weight:600;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;font-size:14px;color:var(--muted)}
.bar div{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc);width:0}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin:36px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.q{margin:22px 0}.q>label.t{display:block;margin-bottom:8px}.q .n{color:var(--muted);font-size:14px;margin-right:6px}
.req:after{content:" *";color:var(--fg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:560px){.row{grid-template-columns:1fr}}
input[type=number],input[type=text],input[type=email]{width:100%;padding:14px;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.opt{display:flex;align-items:center;gap:12px;padding:6px 0;cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{border:1px solid var(--line);padding:6px 12px;border-radius:999px;cursor:pointer;background:var(--card);font-size:15px}
.chips input{display:none}.chips input:checked+span{color:var(--acc);font-weight:600}.chips label:has(input:checked){border-color:var(--acc)}
button{font:inherit;padding:12px 22px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;margin-top:28px}
#out{margin-top:28px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:8px;display:none}
#out li{margin:4px 0}
.w{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;border:1px solid var(--line);color:var(--muted)}
.w5{border-color:#dc2626;color:#dc2626}.w4{border-color:#d97706;color:#d97706}.err{outline:2px solid #dc2626;outline-offset:6px}
</style></head><body><main>

<div class="row" style="margin-bottom:8px"><div class="q"><label class="t req" for="cname">Your name</label><input type="text" id="cname" placeholder="e.g. Priya Sharma"></div>
<div class="q"><label class="t req" for="cemail">Email</label><input type="email" id="cemail" placeholder="We’ll email your car report here"></div></div>
<div class="row" style="margin-bottom:8px"><div class="q"><label class="t" for="cphone">Phone (optional)</label><input type="text" id="cphone" placeholder="e.g. 98xxxxxx10"></div><div></div></div>
<form id="f"></form>
<button id="go" type="button">Submit & get my recommendation</button>
<p id="saved" style="color:var(--muted);font-size:15px"></p>
<div id="out"></div>
</main>
